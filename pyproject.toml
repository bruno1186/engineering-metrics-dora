[project]
name = "engineering-metrics-dora"
version = "0.1.0"
description = "Calculadora de metricas DORA (Deployment Frequency, Lead Time, Change Failure Rate, MTTR)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
dora-report = "dora.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
